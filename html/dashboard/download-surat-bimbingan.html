<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berkas Perkuliahan - BPM FPIK UBT</title>
    <link rel="stylesheet" href="../../asset/style.css">
    <link rel="stylesheet" href="../../asset/bg-about.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../../asset/image-asset/logo-bpm.png">
    <style>
        :root {
            --primary: #0F4C81;
            --secondary: #1B9AAA;
            --accent: #F4B942;
            --background: #F5F9FC;
            --text: #1E293B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(31, 31, 34, 0.272), rgba(214, 213, 255, 0.272)), url('../../asset/image-asset/bg-hero.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            backdrop-filter: blur(3px);
            color: var(--text);
            min-height: 100vh;
        }

        .navbar {
            background: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            color: white;
            flex-wrap: wrap;
            gap: 15px;
        }

        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-logo .logo-icon {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .navbar-logo .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .navbar-logo h1 {
            font-size: 1.3rem;
        }

        .nav-menu {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-menu a:hover {
            color: var(--accent);
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background: transparent;
            color: white;
            padding: 0;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            border: none;
            cursor: pointer;
            transition: color 0.3s;
        }

        .dropbtn:hover {
            color: var(--accent);
        }

        .dropbtn::after {
            content: " ▼";
            font-size: 10px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 220px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 12px;
            z-index: 1;
            right: 0;
            top: 100%;
            margin-top: 10px;
            overflow: hidden;
        }

        .dropdown-content a {
            color: var(--text);
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            text-align: left;
            margin: 0;
            border-bottom: 1px solid #eef2f7;
        }

        .dropdown-content a:last-child {
            border-bottom: none;
        }

        .dropdown-content a:hover {
            background-color: var(--background);
            color: var(--primary);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .berkas-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h2 {
            color: white;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .page-header p {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        .kategori-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .filter-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active {
            background: var(--accent);
            color: var(--primary);
        }

        .filter-btn:hover {
            background: var(--accent);
            color: var(--primary);
        }

        .berkas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .berkas-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .berkas-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .file-icon {
            width: 60px;
            height: 60px;
            background: #eef2ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .berkas-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .berkas-kategori {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .kategori-bimbingan { background: #e0e7ff; color: #4338ca; }
        .kategori-surat { background: #d4edda; color: #155724; }
        .kategori-formulir { background: #fff3cd; color: #856404; }
        .kategori-lainnya { background: #f3f4f6; color: #4b5563; }

        .berkas-deskripsi {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .berkas-tanggal {
            font-size: 0.7rem;
            color: #999;
            margin-bottom: 15px;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-download:hover {
            background: #0a3a62;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
            color: #666;
        }

        footer {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
            }
            .berkas-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-logo">
        <div class="logo-icon">
            <img src="../../asset/image-asset/logo-bpm.png" alt="Logo BPM">
        </div>
        <h1>BPM FPIK UBT</h1>
    </div>
    <div class="nav-menu">
        <a href="../../index.html">Beranda</a>
        <a href="../about.html">Tentang</a>
        <div class="dropdown">
            <button class="dropbtn">More</button>
            <div class="dropdown-content">
                <a href="penilaian.html">Penilaian Dosen</a>
                <a href="aspirasi.html">Aspirasi</a>
                <a href="../../qr-generator.html">QR Code</a>
                <a href="sejarah.html">Sejarah</a>
                <a href="author.html">Pengembang</a>
                <a href="download-surat-bimbingan.html">Berkas Perkuliahan</a>
                <a href="administrasi.html">Administrasi</a>
            </div>
        </div>
    </div>
</nav>

<div class="berkas-container">
    <div class="page-header">
        <h2>Berkas Perkuliahan</h2>
        <p>Download berbagai dokumen penting untuk keperluan akademik dan administrasi</p>
    </div>

    <div class="kategori-filter">
        <button class="filter-btn active" data-kategori="semua">Semua</button>
        <button class="filter-btn" data-kategori="Bimbingan">Bimbingan</button>
        <button class="filter-btn" data-kategori="Surat">Surat</button>
        <button class="filter-btn" data-kategori="Formulir">Formulir</button>
        <button class="filter-btn" data-kategori="Lainnya">Lainnya</button>
    </div>

    <div id="berkasGrid" class="berkas-grid">
        <div class="loading">Memuat berkas...</div>
    </div>
</div>

<footer>
    <p>© 2026 BPM FPIK UBT</p>
    <p style="font-size: 0.7rem; margin-top: 5px;">Version: 0.1.4 | Berkas Perkuliahan</p>
</footer>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzElA-8pOdO9SLZU9SUHbuP2wINi1va1Z8XIFNK9htVnv6OnSy7xmUIrCR0EKGEcbXPzA/exec';
    
    let semuaBerkas = [];
    let kategoriAktif = 'semua';
    
    async function loadBerkas() {
        const container = document.getElementById('berkasGrid');
        container.innerHTML = '<div class="loading">Memuat berkas...</div>';
        
        try {
            const response = await fetch(API_URL + '?action=getBerkas');
            const result = await response.json();
            
            if (result.success && result.data && result.data.length > 0) {
                semuaBerkas = result.data;
                renderBerkas();
            } else {
                container.innerHTML = '<div class="empty-state">Belum ada berkas yang tersedia</div>';
            }
        } catch (error) {
            console.error('Error:', error);
            container.innerHTML = '<div class="empty-state">Gagal memuat berkas. Silakan coba lagi nanti.</div>';
        }
    }
    
    function renderBerkas() {
        const container = document.getElementById('berkasGrid');
        
        let filtered = semuaBerkas;
        if (kategoriAktif !== 'semua') {
            filtered = semuaBerkas.filter(b => b.kategori === kategoriAktif);
        }
        
        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-state">Tidak ada berkas dalam kategori ini</div>';
            return;
        }
        
        let html = '';
        for (const b of filtered) {
            let kategoriClass = '';
            switch(b.kategori) {
                case 'Bimbingan': kategoriClass = 'kategori-bimbingan'; break;
                case 'Surat': kategoriClass = 'kategori-surat'; break;
                case 'Formulir': kategoriClass = 'kategori-formulir'; break;
                default: kategoriClass = 'kategori-lainnya';
            }
            
            let fileIcon = '📄';
            if (b.namaFile && b.namaFile.toLowerCase().includes('.pdf')) fileIcon = '📕';
            else if (b.namaFile && b.namaFile.toLowerCase().includes('.doc')) fileIcon = '📘';
            else if (b.namaFile && b.namaFile.toLowerCase().includes('.xls')) fileIcon = '📗';
            else if (b.namaFile && b.namaFile.toLowerCase().includes('.jpg')) fileIcon = '🖼️';
            
            html += `
                <div class="berkas-card">
                    <div class="file-icon">${fileIcon}</div>
                    <div class="berkas-title">${escapeHtml(b.judul)}</div>
                    <span class="berkas-kategori ${kategoriClass}">${escapeHtml(b.kategori)}</span>
                    <div class="berkas-deskripsi">${escapeHtml(b.deskripsi || 'Tidak ada deskripsi')}</div>
                    <div class="berkas-tanggal">Upload: ${escapeHtml(b.tanggal)}</div>
                    <a href="${escapeHtml(b.link)}" class="btn-download" target="_blank">Download</a>
                </div>
            `;
        }
        container.innerHTML = html;
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            kategoriAktif = this.getAttribute('data-kategori');
            renderBerkas();
        });
    });
    
    loadBerkas();
</script>
</body>
</html>
