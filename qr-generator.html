<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - BPM FPIK UBT</title>
    <link rel="stylesheet" href="asset/style.css">
    <link rel="stylesheet" href="asset/bg-about.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="asset/image-asset/logo-bpm.png">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #0F4C81;
            --secondary: #1B9AAA;
            --accent: #F4B942;
            --background: #F5F9FC;
            --text: #1E293B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(31, 31, 34, 0.272), rgba(214, 213, 255, 0.272)), url('asset/image-asset/bg-hero.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            backdrop-filter: blur(3px);
            color: var(--text);
            min-height: 100vh;
        }

        .navbar {
            background: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            color: white;
            flex-wrap: wrap;
            gap: 15px;
        }

        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-logo .logo-icon {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .navbar-logo .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .navbar-logo h1 {
            font-size: 1.3rem;
        }

        .nav-menu {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-menu a:hover {
            color: var(--accent);
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background: transparent;
            color: white;
            padding: 0;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            border: none;
            cursor: pointer;
            transition: color 0.3s;
        }

        .dropbtn:hover {
            color: var(--accent);
        }

        .dropbtn::after {
            content: " ▼";
            font-size: 10px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 220px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 12px;
            z-index: 1;
            right: 0;
            top: 100%;
            margin-top: 10px;
            overflow: hidden;
        }

        .dropdown-content a {
            color: var(--text);
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            text-align: left;
            margin: 0;
            border-bottom: 1px solid #eef2f7;
        }

        .dropdown-content a:last-child {
            border-bottom: none;
        }

        .dropdown-content a:hover {
            background-color: var(--background);
            color: var(--primary);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .qr-container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
        }

        .qr-container h2 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .qr-container .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(244,185,66,0.2);
        }

        .btn-generate {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-generate:hover {
            background: #0a3a62;
            transform: translateY(-2px);
        }

        .qr-result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 16px;
            display: none;
        }

        .qr-result.show {
            display: block;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .btn-download {
            background: var(--accent);
            color: var(--primary);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-download:hover {
            background: #e0a82b;
            transform: translateY(-2px);
        }

        footer {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
            }
            .qr-container {
                margin: 30px 20px;
                padding: 25px;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-logo">
        <div class="logo-icon">
            <img src="asset/image-asset/logo-bpm.png" alt="Logo BPM">
        </div>
        <h1>BPM FPIK UBT</h1>
    </div>
    <div class="nav-menu">
        <a href="index.html">Beranda</a>
        <a href="about.html">Tentang</a>
        <div class="dropdown">
            <button class="dropbtn">More</button>
            <div class="dropdown-content">
                <a href="html/dashboard/penilaian.html">Penilaian Dosen</a>
                <a href="html/dashboard/aspirasi.html">Aspirasi</a>
                <a href="qr-generator.html">QR Code</a>
                <a href="html/dashboard/sejarah.html">Sejarah</a>
                <a href="html/dashboard/author.html">Pengembang</a>
                <a href="html/dashboard/download-surat-bimbingan.html">Berkas Perkuliahan</a>
                <a href="html/dashboard/administrasi.html">Administrasi</a>
            </div>
        </div>
    </div>
</nav>

<section style="padding: 40px 8%;">
    <div class="qr-container">
        <h2>QR Code Generator</h2>
        <p class="subtitle">Generate QR Code untuk teks, link, atau data apapun</p>

        <div class="form-group">
            <label>Masukkan Teks atau URL</label>
            <input type="text" id="qrText" placeholder="Contoh: https://bpmfpikubt.com atau teks apapun">
        </div>

        <button class="btn-generate" onclick="generateQR()">Generate QR Code</button>

        <div id="qrResult" class="qr-result">
            <div id="qrcode"></div>
            <button class="btn-download" onclick="downloadQR()">Download QR Code</button>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 BPM FPIK UBT</p>
    <p style="font-size: 0.7rem; margin-top: 5px;">Version: 0.1.4 | QR Code Generator</p>
</footer>

<script>
    let currentQRCode = null;

    function generateQR() {
        const text = document.getElementById('qrText').value.trim();
        const resultDiv = document.getElementById('qrResult');
        
        if (!text) {
            alert('Masukkan teks atau URL terlebih dahulu!');
            return;
        }
        
        // Hapus QR code lama
        document.getElementById('qrcode').innerHTML = '';
        
        // Generate QR code baru
        currentQRCode = new QRCode(document.getElementById('qrcode'), {
            text: text,
            width: 200,
            height: 200,
            colorDark: '#0F4C81',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
        
        resultDiv.classList.add('show');
    }

    function downloadQR() {
        const qrcodeDiv = document.getElementById('qrcode');
        const canvas = qrcodeDiv.querySelector('canvas');
        
        if (!canvas) {
            alert('Generate QR Code terlebih dahulu!');
            return;
        }
        
        const link = document.createElement('a');
        link.download = 'qrcode.png';
        link.href = canvas.toDataURL();
        link.click();
    }
</script>
</body>
</html>
